<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zakho Book Fair | Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#10243a;--gold:#c8a466;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Cairo,Arial,sans-serif}.top{background:#10243a;color:white;padding:24px max(20px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.top h1{font-size:22px;margin:0}.top small{color:#dbc49a}.wrap{max-width:1240px;margin:30px auto;padding:0 20px}.card{background:white;border:1px solid #e6e9ed;border-radius:16px;padding:22px;box-shadow:0 10px 28px #11243a09}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat b{font-size:32px;display:block}.stat small{color:#6c7b88}button{border:0;background:#173e4d;color:white;padding:11px 16px;border-radius:9px;cursor:pointer;font:inherit;font-weight:700}button:disabled{opacity:.5;cursor:wait}.approve{background:#187354}.reject{background:#ad4c49}.secondary{background:#e9edf1;color:#183348}input,select{padding:11px;border:1px solid #d9e0e5;border-radius:9px;font:inherit;max-width:100%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.toolbar input{flex:1;min-width:210px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:right}th,td{padding:13px;border-bottom:1px solid #edf0f2;font-size:13px}th{background:#f8fafb;color:#637485}td.pub{max-width:240px;white-space:pre-wrap;min-width:170px;max-height:120px;overflow:auto}.pill{border-radius:50px;padding:4px 9px;font-size:11px;font-weight:800;background:#fff0cf;color:#946100}.Approved{background:#dcf5e9;color:#14704b}.Rejected{background:#ffe8e6;color:#a53737}.actions{display:flex;gap:5px}#login{max-width:430px;margin:90px auto}#login input{width:100%;margin:12px 0}#app{display:none}#notice{margin:10px 0;color:#9b4035;min-height:20px}.muted{color:#6c7b88;font-size:12px}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.top h1{font-size:18px}}</style></head><body><header class="top"><div><h1>داشبۆردا پێشانگەها پەرتووکان یا زاخۆ</h1><small>Registration Management • Zakho International Book Fair</small></div><button id="refresh" style="display:none" onclick="load()">↻ نووکرنەوە</button></header><section class="card" id="login"><h2>چوونا ژوورێ یا ئەدمین</h2><p class="muted">وشەیا نهێنی یا Script Properties بنڤیسە.</p><input type="password" id="password" placeholder="Admin password" autocomplete="current-password"><button onclick="signIn()">چوونا ژوورێ</button><div id="loginError"></div></section><main id="app" class="wrap"><section class="stats"><div class="card stat"><small>هەمی داواکاری</small><b id="total">0</b></div><div class="card stat"><small>چاڤەڕێی پەسەندکرنێ</small><b id="pending">0</b></div><div class="card stat"><small>پەسەندکری</small><b id="approved">0</b></div><div class="card stat"><small>رەتکری</small><b id="rejected">0</b></div></section><section class="card"><div class="toolbar"><input id="search" oninput="render()" placeholder="لێگەریان ب ناڤ، وەلات، ئیمێل، ژمارە..."><select id="filter" onchange="render()"><option value="">هەمی بارودۆخ</option><option>Pending</option><option>Approved</option><option>Rejected</option></select></div><div id="notice"></div><div class="tablewrap"><table><thead><tr><th>کۆد</th><th>بەروار</th><th>ناڤ</th><th>وەلات</th><th>تەلەفون</th><th>ئیمێل</th><th>پەرتووک</th><th>زمان</th><th>بارودۆخ</th><th>ئیمێل هاتە هنارتن؟</th><th>کار</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let token='',items=[];const el=id=>document.getElementById(id);function signIn(){el('loginError').textContent='';google.script.run.withSuccessHandler(t=>{token=t;el('login').style.display='none';el('app').style.display='block';el('refresh').style.display='block';load()}).withFailureHandler(e=>el('loginError').textContent=e.message).login(el('password').value)}function load(){el('notice').textContent='Loading...';google.script.run.withSuccessHandler(data=>{items=data;el('notice').textContent='';render()}).withFailureHandler(e=>el('notice').textContent=e.message).listRegistrations(token)}function txt(v){return String(v??'')}function render(){let q=el('search').value.toLowerCase(),f=el('filter').value;for(const [id,condition] of [['total',()=>true],['pending',x=>x.status==='Pending'],['approved',x=>x.status==='Approved'],['rejected',x=>x.status==='Rejected']])el(id).textContent=items.filter(condition).length;let body=el('rows');body.replaceChildren();items.filter(x=>(!f||x.status===f)&&[x.id,x.name,x.country,x.phone,x.email,x.publications].some(v=>txt(v).toLowerCase().includes(q))).forEach(x=>{let tr=document.createElement('tr');[x.id,x.date?new Date(x.date).toLocaleString(): '',x.name,x.country,x.phone,x.email,x.publications,x.language,x.status,x.emailStatus].forEach((v,i)=>{let td=document.createElement('td');td.textContent=txt(v);if(i===6)td.className='pub';if(i===8){let s=document.createElement('span');s.className='pill '+x.status;s.textContent=v;td.textContent='';td.append(s)}tr.append(td)});let td=document.createElement('td');if(x.status==='Pending'){for(let [name,value,cls] of [['پەسەندکرن','Approved','approve'],['رەتکرن','Rejected','reject']]){let b=document.createElement('button');b.className=cls;b.textContent=name;b.onclick=()=>decide(x.id,value);td.append(b)}}else td.textContent='—';tr.append(td);body.append(tr)})}function decide(id,status){if(!confirm(status==='Approved'?'پەسەند بکەم و ئیمێلێ بۆ بهنێرم؟':'رەت بکەم و ئیمێلێ بۆ بهنێرم؟'))return;el('notice').textContent='Processing...';google.script.run.withSuccessHandler(r=>{el('notice').textContent=r.emailStatus==='Sent'?'ب سەرکەفتی هاتە هنارتن':r.emailStatus;load()}).withFailureHandler(e=>el('notice').textContent=e.message).decide(token,id,status)}</script></body></html>
